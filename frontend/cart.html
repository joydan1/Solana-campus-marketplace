<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Solana Marketplace</title>
  
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <!-- Header Section -->
  <section id="header">
    <a href="./index.html"><img src="img_orig/logo.png" class="logo" alt="Solana Marketplace Logo"></a>
    <div>
      <ul id="navbar">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./product.html">Product</a></li>
        <li><a href="./auction.html">Auction</a></li>
        <li id="lg-bag"><a class="active" href="./cart.html"><i class="fa-solid fa-basket-shopping"></i></a></li>
        <li><button id="connectWalletBtn" class="normal">Connect Wallet</button></li>
        <a href="#" id="close"><i class="fa-solid fa-xmark"></i></a>
      </ul>
    </div>
    <div id="mobile">
      <a href="./cart.html"><i class="fa-solid fa-basket-shopping"></i></a>
      <i id="bar" class="fa-solid fa-bars"></i>
    </div>
  </section>

  <!-- Cart Section -->
  <section id="cart" class="section-p1">
    <h1>Your Cart</h1>
    <table id="cart-table">
      <thead>
        <tr>
          <th>Image</th>
          <th>Product</th>
          <th>Price (SOL)</th>
          <th>Quantity</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody>
        <!-- Items will be loaded here dynamically -->
      </tbody>
    </table>
    <div class="cart-summary">
      <h3>Total: <span id="grandTotal">0.000</span> SOL</h3>
      <button id="checkout-btn" class="normal">Checkout</button>
    </div>
  </section>

 
  <script src="./script.js"></script>
  <script src="./cart.js"></script>
  <script type="module" src="./wallet.js"></script>
</body>
</html>
